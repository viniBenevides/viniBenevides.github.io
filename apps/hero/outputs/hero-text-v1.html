<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exported Hero Block</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    .hero {
      @apply w-full flex flex-col justify-center px-6 py-16 md:px-12 md:py-24 transition-colors duration-200 box-border;
    }
    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }
    .hero-light {
      @apply bg-slate-50;
    }
    .hero-dark {
      @apply bg-slate-900;
    }
    .hero-content {
      @apply max-w-4xl w-full mx-auto space-y-6;
    }
    .hero-centre {
      @apply text-center;
    }
    .hero h1 {
      @apply text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight;
    }
    .hero-light h1 {
      @apply text-slate-900;
    }
    .hero-dark h1 {
      @apply text-slate-50;
    }
    .hero h2 {
      @apply text-lg sm:text-xl md:text-2xl font-normal leading-relaxed max-w-2xl;
    }
    .hero-light h2 {
      @apply text-slate-700;
    }
    .hero-dark h2 {
      @apply text-slate-300;
    }
    .hero-centre h2 {
      @apply mx-auto;
    }
    </style>
</head>
<body>
  <header class="hero hero-light hero-min-height">
    <div class="hero-content">
      <h1>Lorem ipsum dolor sit amet</h1>
      <h2>Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </header>
</body>
</html>
